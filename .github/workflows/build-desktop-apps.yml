name: Build Desktop Apps (Windows .exe & macOS .app)

on:
  push:
    branches: [ main ]
    paths:
      - 'pondi_facial_management_system.py'
      - '.github/workflows/build-desktop-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "x64 (Intel & AMD 64-bit)"
            runner: windows-latest
            arch: x64
            qt_pkg: PyQt5
            exclude_qt: PyQt6
            artifact: PONDI_Facial_Management_System-Windows-x64
            exe_name: PONDI_Facial_Management_System-Windows-x64
          - label: "x86 (32-bit)"
            runner: windows-latest
            arch: x86
            qt_pkg: PyQt5
            exclude_qt: PyQt6
            artifact: PONDI_Facial_Management_System-Windows-x86-32bit
            exe_name: PONDI_Facial_Management_System-Windows-x86-32bit
          - label: "ARM64 (Qualcomm / ARM PCs)"
            runner: windows-11-arm
            arch: arm64
            qt_pkg: PyQt6
            exclude_qt: PyQt5
            artifact: PONDI_Facial_Management_System-Windows-ARM64
            exe_name: PONDI_Facial_Management_System-Windows-ARM64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (${{ matrix.arch }})
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-contrib-python numpy ${{ matrix.qt_pkg }} pyinstaller

      - name: Download OpenCV Zoo ONNX face models (YuNet + SFace)
        shell: pwsh
        run: |
          python -c "
          import os, urllib.request
          os.makedirs('models', exist_ok=True)
          urls = {
              'models/face_detection_yunet_2023mar.onnx': 'https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx',
              'models/face_recognition_sface_2021dec.onnx': 'https://github.com/opencv/opencv_zoo/raw/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx',
          }
          for dest, url in urls.items():
              print('Downloading', dest)
              urllib.request.urlretrieve(url, dest)
              size = os.path.getsize(dest)
              print(f'  -> {size:,} bytes')
              assert size > 10000, f'Downloaded file too small: {dest}'
          "

      - name: Build Windows .exe with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "${{ matrix.exe_name }}" `
            --add-data "models\face_detection_yunet_2023mar.onnx;models" `
            --add-data "models\face_recognition_sface_2021dec.onnx;models" `
            --collect-data cv2 `
            --exclude-module ${{ matrix.exclude_qt }} `
            --exclude-module tkinter `
            pondi_facial_management_system.py

      - name: Verify & smoke-test built Windows executable
        shell: pwsh
        run: |
          $exe = "dist\${{ matrix.exe_name }}.exe"
          if (-not (Test-Path $exe)) { throw "Executable not found: $exe" }
          $info = Get-Item $exe
          Write-Host "Built: $($info.FullName) ($([math]::Round($info.Length / 1MB, 2)) MB)"
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath $info.FullName -ArgumentList "--smoke-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
          Write-Host "Windows executable smoke-test PASSED (exit code 0)!"

      - name: Upload Windows .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.exe_name }}.exe
          retention-days: 90

  build-macos:
    name: macOS ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "Apple Silicon (ARM64)"
            runner: macos-15
            artifact: PONDI_Facial_Management_System-macOS-ARM64
            zip_name: PONDI_Facial_Management_System-macOS-ARM64.zip
          - label: "Intel (x86_64)"
            runner: macos-15-intel
            artifact: PONDI_Facial_Management_System-macOS-Intel-x64
            zip_name: PONDI_Facial_Management_System-macOS-Intel-x64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install opencv-contrib-python numpy PyQt5 pyinstaller

      - name: Download OpenCV Zoo ONNX face models (YuNet + SFace)
        run: |
          python3 -c "
          import os, urllib.request
          os.makedirs('models', exist_ok=True)
          urls = {
              'models/face_detection_yunet_2023mar.onnx': 'https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx',
              'models/face_recognition_sface_2021dec.onnx': 'https://github.com/opencv/opencv_zoo/raw/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx',
          }
          for dest, url in urls.items():
              print('Downloading', dest)
              urllib.request.urlretrieve(url, dest)
              size = os.path.getsize(dest)
              print(f'  -> {size:,} bytes')
              assert size > 10000, f'Downloaded file too small: {dest}'
          "

      - name: Build macOS .app bundle with PyInstaller
        run: |
          python3 -m PyInstaller --noconfirm --clean --windowed \
            --name "PONDI Facial Management System" \
            --osx-bundle-identifier "com.pondi.facialmanagementsystem" \
            --add-data "models/face_detection_yunet_2023mar.onnx:models" \
            --add-data "models/face_recognition_sface_2021dec.onnx:models" \
            --collect-data cv2 \
            --exclude-module PyQt6 \
            --exclude-module tkinter \
            pondi_facial_management_system.py

      - name: Configure macOS Camera Permission, Ad-Hoc Sign & Smoke-Test .app
        run: |
          PLIST="dist/PONDI Facial Management System.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'PONDI Facial Management System requires camera access to scan and register university student faces.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSHighResolutionCapable" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "$PLIST"
          codesign --force --deep --sign - "dist/PONDI Facial Management System.app"
          QT_QPA_PLATFORM=offscreen "dist/PONDI Facial Management System.app/Contents/MacOS/PONDI Facial Management System" --smoke-test
          ditto -c -k --sequesterRsrc --keepParent "dist/PONDI Facial Management System.app" "dist/${{ matrix.zip_name }}"
          ls -lh "dist/${{ matrix.zip_name }}"

      - name: Upload macOS .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.zip_name }}
          retention-days: 90
